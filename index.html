<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <main>
        <section class="calculator" aria-label="Calculator">
            <div class="display" aria-label="Calculator display">12345</div>

            <div class="buttons" aria-label="Calculator buttons">
                <button class="clear wide">clear</button>
                <button class="operator">&divide;</button>
                <button class="operator">&times;</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">-</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">+</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">%</button>
                <button class="wide">0</button>
                <button>.</button>  
                <button class="equals">=</button>
            </div>
        </section>
    </main>

    <br><br>
    <footer>
            <p>Copyright &copy; The Odin Project 2026 <br>
                <a class="github-link" href="https://github.com/Valetish" target="_blank" rel="noreferrer noopener" aria-label="Visit Valetish on GitHub">
                    <img class="github-icon" src="github_logo.png" alt="GitHub logo">
                    <span>Valetish</span>
                </a></p>
    </footer>
</body>
</html>
